name: Build Debian Linux Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: "28 10 * * 1"

permissions:
  contents: read

concurrency:
  group: build-debian-kernel
  cancel-in-progress: false

env:
  KERNEL_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  DEBIAN_FRONTEND: noninteractive

jobs:
  check:
    name: Check for a new stable kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine whether the kernel source changed
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(
            git ls-remote --tags "$KERNEL_REPO" \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -Ev '\^\{\}|-rc' \
              | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V \
              | tail -n 1
          )"

          if ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unexpected tag format: '$latest_tag'"
            exit 1
          fi

          version="${latest_tag#v}"
          release_tag="v${version}-shouyu"
          published_tags="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          existing_release=""

          while IFS= read -r published_tag; do
            if [[ "$published_tag" == "$release_tag" || "$published_tag" == "$latest_tag" ]]; then
              existing_release="$published_tag"
              break
            fi

            # The old workflow produced tags such as v7.1.4-30 and
            # v7.0.6-cloud-5.
            if [[ "$published_tag" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)(-cloud)?-[0-9]+$ ]] \
              && [[ "${BASH_REMATCH[1]}" == "$version" ]]; then
              existing_release="$published_tag"
              break
            fi
          done <<< "$published_tags"

          should_build=true
          if [[ -n "$existing_release" ]]; then
            should_build=false
            echo "Kernel source $latest_tag was already built in release $existing_release."
          else
            echo "Kernel source $latest_tag is new and will be built as $release_tag."
          fi

          {
            echo "source_tag=$latest_tag"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Kernel source check"
            echo
            echo "- Latest stable source: \`$latest_tag\`"
            echo "- Release tag: \`$release_tag\`"
            echo "- Build required: \`$should_build\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ needs.check.outputs.source_tag }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex libncurses-dev \
            libssl-dev libelf-dev bison dwarves debhelper rsync libdw-dev fakeroot

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone stable kernel
        run: |
          git clone --depth=1 --branch "${{ needs.check.outputs.source_tag }}" "$KERNEL_REPO" /tmp/linux

      - name: Configure kernel
        run: |
          set -euxo pipefail
          cd /tmp/linux

          # Start with the runner's complete config.
          cp /boot/config-"$(uname -r)" .config
          make olddefconfig
          grep -v '^##' "$GITHUB_WORKSPACE/config.cloud" > /tmp/frag.cloud
          grep -v '^##' "$GITHUB_WORKSPACE/config.cloud-amd64" > /tmp/frag.cloud-amd64
          scripts/kconfig/merge_config.sh -m .config \
            /tmp/frag.cloud \
            /tmp/frag.cloud-amd64

          # Identify this build in uname, package names, and /boot filenames.
          scripts/config --set-str LOCALVERSION "-shouyu"
          scripts/config --disable LOCALVERSION_AUTO

          # Custom size and signing settings.
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_DWARF5
          scripts/config --enable DEBUG_INFO_NONE
          scripts/config --disable MODULE_SIG
          scripts/config --disable MODULE_SIG_ALL
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""

          # BBR.
          scripts/config --enable TCP_CONG_ADVANCED
          scripts/config --enable TCP_CONG_BBR
          scripts/config --enable DEFAULT_BBR
          scripts/config --disable DEFAULT_CUBIC
          scripts/config --set-str DEFAULT_TCP_CONG bbr

          # Server tuning.
          scripts/config --set-val NR_CPUS 64
          scripts/config --enable NO_HZ_IDLE
          scripts/config --enable HZ_250
          scripts/config --disable HZ_1000
          scripts/config --enable PREEMPT_VOLUNTARY
          scripts/config --disable PREEMPT

          # Ensure cloud fragments do not disable Docker requirements.
          scripts/config --enable CGROUPS
          scripts/config --enable NAMESPACES
          scripts/config --enable NET_NS
          scripts/config --enable PID_NS
          scripts/config --enable IPC_NS
          scripts/config --enable UTS_NS
          scripts/config --enable USER_NS
          scripts/config --enable MEMCG
          scripts/config --enable CGROUP_PIDS
          scripts/config --enable CGROUP_DEVICE
          scripts/config --enable CGROUP_FREEZER
          scripts/config --enable CPUSETS
          scripts/config --enable BLK_CGROUP
          scripts/config --enable VETH
          scripts/config --enable BRIDGE
          scripts/config --enable BRIDGE_NETFILTER
          scripts/config --enable NETFILTER_XT_MATCH_CONNTRACK
          scripts/config --enable NETFILTER_XT_MATCH_ADDRTYPE
          scripts/config --enable NF_NAT
          scripts/config --enable IP_NF_NAT
          scripts/config --enable IP_NF_FILTER
          scripts/config --enable IP_NF_IPTABLES
          scripts/config --enable IP_NF_TARGET_MASQUERADE
          scripts/config --module OVERLAY_FS
          scripts/config --enable SECCOMP
          scripts/config --enable SECCOMP_FILTER
          scripts/config --enable POSIX_MQUEUE
          make olddefconfig

          echo "=== Verifying kernel config ==="
          fail=0
          check_config() {
            if ! grep -qE "$1" .config; then
              echo "::error::MISSING: $1"
              fail=1
            fi
          }

          check_config '^CONFIG_LOCALVERSION="-shouyu"$'
          check_config '^# CONFIG_LOCALVERSION_AUTO is not set$'
          check_config '^CONFIG_TCP_CONG_BBR=(y|m)'
          check_config '^CONFIG_DEFAULT_TCP_CONG="bbr"'
          check_config '^CONFIG_NAMESPACES=y'
          check_config '^CONFIG_NET_NS=y'
          check_config '^CONFIG_PID_NS=y'
          check_config '^CONFIG_CGROUPS=y'
          check_config '^CONFIG_MEMCG=y'
          check_config '^CONFIG_VETH=(y|m)'
          check_config '^CONFIG_BRIDGE=(y|m)'
          check_config '^CONFIG_OVERLAY_FS=(y|m)'
          check_config '^CONFIG_NETFILTER_XT_MATCH_CONNTRACK=(y|m)'
          check_config '^CONFIG_NF_NAT=(y|m)'
          check_config '^CONFIG_IP_NF_NAT=(y|m)'
          check_config '^CONFIG_SECCOMP=y'
          check_config '^CONFIG_VIRTIO_NET=(y|m)'
          check_config '^CONFIG_VIRTIO_BLK=(y|m)'
          check_config '^CONFIG_EXT4_FS=(y|m)'

          if [[ "$fail" -ne 0 ]]; then
            echo "::error::Kernel config verification failed"
            exit 1
          fi
          echo "All checks passed."

      - name: Build kernel
        run: |
          set -euxo pipefail
          cd /tmp/linux
          KREL="$(make -s kernelrelease)"
          if [[ "$KREL" != *-shouyu ]]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi
          fakeroot make -j"$(nproc)" deb-pkg KDEB_PKGVERSION="${KREL}-1"

      - name: Get kernel release
        id: krel
        run: |
          set -euo pipefail
          cd /tmp/linux
          release="$(make -s kernelrelease)"
          expected="${{ needs.check.outputs.version }}-shouyu"
          if [[ "$release" != "$expected" ]]; then
            echo "::error::Expected kernel release $expected, got $release"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Collect and verify Debian packages
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find /tmp -maxdepth 1 -type f \
            \( -name "linux-image-*.deb" -o -name "linux-headers-*.deb" \) \
            -exec cp -v {} artifacts/ \;
          ls -lh artifacts/
          find artifacts -name "linux-image-*.deb" | grep -q . || \
            { echo "::error::linux-image package missing"; exit 1; }
          find artifacts -name "linux-headers-*.deb" | grep -q . || \
            { echo "::error::linux-headers package missing"; exit 1; }

      - name: Verify BBR in image package
        run: |
          set -euxo pipefail
          image_deb="$(find artifacts -name "linux-image-*.deb" | head -n 1)"
          mkdir -p /tmp/img-check
          dpkg-deb -x "$image_deb" /tmp/img-check

          if find /tmp/img-check/lib/modules -type f \
            \( -name "tcp_bbr.ko" -o -name "tcp_bbr.ko.*" \) | grep -q .; then
            echo "BBR module found"
            exit 0
          fi

          cfg="$(find /tmp/img-check/boot -type f -name "config-*" | head -n 1)"
          grep -q '^CONFIG_TCP_CONG_BBR=y' "$cfg" || \
            { echo "::error::BBR not built-in"; exit 1; }

      - name: Generate README
        run: |
          set -euo pipefail
          cat > artifacts/README.md <<EOF
          # Debian Kernel Build
          | Item | Value |
          |------|-------|
          | Kernel Version | \`${{ steps.krel.outputs.release }}\` |
          | Upstream Source | \`${{ needs.check.outputs.source_tag }}\` |
          | Build Date | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | Base Config | Ubuntu runner (Docker-ready) |
          | BBR | Default congestion control |
          | Docker Support | cgroups, namespaces, overlay, veth, bridge, netfilter |
          EOF

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Debian Kernel ${{ steps.krel.outputs.release }}"
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.release_tag }}
          name: "Debian Kernel ${{ steps.krel.outputs.release }}"
          files: artifacts/*
          body_path: artifacts/README.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
